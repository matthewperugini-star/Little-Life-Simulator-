<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Little Life Simulator</title>
<style>
:root{--green:#4e8746;--light:#edf7e8;--dark:#274027;--line:#8cad83}
*{box-sizing:border-box}body{margin:0;background:#dceccf;color:var(--dark);font-family:Arial,Helvetica,sans-serif}
header{background:var(--green);color:#fff;padding:14px;position:sticky;top:0;z-index:30}
h1{margin:0 0 9px;font-size:23px}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{background:#ffffff25;border-radius:9px;padding:6px 9px;font-size:13px}
nav{display:flex;gap:7px;flex-wrap:wrap;padding:9px;background:#f8fbf5;position:sticky;top:92px;z-index:29;border-bottom:1px solid #c4d7bd}
button{border:0;border-radius:9px;padding:9px 12px;background:#d9ecd3;color:#294a28;font-weight:700}button.active{background:#356e30;color:white}
.panel{margin:10px;background:#fff;border:3px solid #75986d;border-radius:16px;padding:12px}.hidden{display:none!important}
#world{height:62vh;min-height:450px;padding:0;position:relative;overflow:hidden;background:#9fd57f;border-radius:13px}
.terrain{position:absolute;font-size:24px;user-select:none}.food{position:absolute;font-size:25px;user-select:none}.house{position:absolute;font-size:28px;user-select:none}
.person{position:absolute;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid #527c4a;display:flex;align-items:center;justify-content:center;font-size:23px;z-index:5;transition:left .55s linear,top .55s linear}.label{position:absolute;top:40px;left:50%;transform:translateX(-50%);background:#fff;color:#223522;border-radius:4px;padding:2px 4px;font-size:10px;white-space:nowrap;font-weight:bold}
.notice{font-size:13px;color:#5d7059;margin:4px 0 10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #d9e5d5;padding:9px 2px}.tag{font-size:11px;background:#e4f0df;border-radius:6px;padding:4px 6px;white-space:nowrap}
#family{min-height:62vh;overflow:auto}.tree-controls{display:flex;gap:7px;margin-bottom:10px}.tree{display:inline-block;min-width:100%;transform-origin:top left}.roots{display:flex;gap:20px;min-width:max-content;align-items:flex-start}.branch{display:flex;flex-direction:column;align-items:center}.card{min-width:132px;background:var(--light);border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center}.small{font-size:11px;color:#5d7059;margin-top:4px;line-height:1.35}.kids{display:flex;gap:12px;margin-top:22px}
h2{margin:4px 0 8px}
</style>
</head>
<body>
<header>
<h1>Little Life Simulator</h1>
<div class="stats">
<span class="stat">People: <b id="pop">2</b></span>
<span class="stat">Food: <b id="food">10</b></span>
<span class="stat">Generation: <b id="gen">1</b></span>
<span class="stat">Year: <b id="yr">1</b></span>
</div>
</header>
<nav>
<button id="worldTab" class="active">World</button><button id="treeTab">Family Tree</button><button id="peopleTab">People</button><button id="pause">Pause</button><button id="restart">Restart</button>
</nav>

<section id="world" class="panel"></section>
<section id="family" class="panel hidden"></section>
<section id="peoplePanel" class="panel hidden"></section>

<script>
const W=document.getElementById("world"),F=document.getElementById("family"),P=document.getElementById("peoplePanel");
let people=[],foods=[],houses=[],nextId=0,stored=10,year=1,clock=0,foodClock=0,birthClock=0,paused=false;
const names=["Alex","Sam","Jamie","Taylor","Morgan","Riley","Jordan","Casey","Avery","Quinn","Parker","Drew","Rowan","Cameron","Skyler","Reese","Finley","Charlie","Emery","Harper","Logan","Sage","Blake","Robin","River","Dakota","Ellis","Milo","Nora","Leo"];
const R=(a,b)=>Math.random()*(b-a)+a, pick=a=>a[Math.floor(Math.random()*a.length)];
function addPerson(parents=[],gen=1){
 let p={id:++nextId,name:pick(names)+" "+nextId,x:R(5,90),y:R(7,84),parents:parents.map(x=>x.id),children:[],gen,age:Math.floor(R(18,31)),alive:true,el:null};
 people.push(p);parents.forEach(x=>x.children.push(p.id));return p;
}
function addFood(n=1){for(let i=0;i<n;i++)foods.push({x:R(4,94),y:R(6,90)})}
function drawWorld(){
 W.innerHTML="";
 for(let i=0;i<14;i++){let e=document.createElement("span");e.className="terrain";e.textContent="Tree";e.style.left=R(0,94)+"%";e.style.top=R(0,90)+"%";W.appendChild(e)}
 houses.forEach(h=>{let e=document.createElement("span");e.className="house";e.textContent="Home";e.style.left=h.x+"%";e.style.top=h.y+"%";W.appendChild(e)});
 foods.forEach(f=>{let e=document.createElement("span");e.className="food";e.textContent="Food";e.style.left=f.x+"%";e.style.top=f.y+"%";W.appendChild(e)});
 people.filter(p=>p.alive).forEach(p=>{let e=document.createElement("span");e.className="person";e.textContent=p.id%2?"P":"A";let l=document.createElement("span");l.className="label";l.textContent=p.name;e.appendChild(l);e.style.left=p.x+"%";e.style.top=p.y+"%";p.el=e;W.appendChild(e)});
}
function move(){
 people.filter(p=>p.alive).forEach(p=>{
  if(foods.length){
   let t=foods.reduce((b,f)=>Math.hypot(f.x-p.x,f.y-p.y)<Math.hypot(b.x-p.x,b.y-p.y)?f:b,foods[0]);
   p.x+=(t.x-p.x)*.12;p.y+=(t.y-p.y)*.12;
   if(Math.hypot(t.x-p.x,t.y-p.y)<2.5){foods.splice(foods.indexOf(t),1);stored++}
  }else{p.x=Math.max(2,Math.min(91,p.x+R(-2,2)));p.y=Math.max(3,Math.min(88,p.y+R(-2,2)))}
  if(p.el){p.el.style.left=p.x+"%";p.el.style.top=p.y+"%"}
 });
}
function reproduce(){
 let living=people.filter(p=>p.alive);if(living.length>=40||living.length<2||stored<12)return;
 let a=pick(living),b=pick(living.filter(x=>x!==a));stored-=8;
 let c=addPerson([a,b],Math.max(a.gen,b.gen)+1);c.x=(a.x+b.x)/2;c.y=(a.y+b.y)/2;
 if(houses.length<Math.ceil((living.length+1)/3))houses.push({x:R(7,87),y:R(8,85)});
 drawWorld();
}
function age(){
 people.filter(p=>p.alive).forEach(p=>{p.age++;if(p.age>=80&&Math.random()<.5)p.alive=false});
}
function stats(){
 pop.textContent=people.filter(p=>p.alive).length;food.textContent=stored+foods.length;gen.textContent=Math.max(...people.map(p=>p.gen));yr.textContent=year;
}
function card(p){
 let par=p.parents.map(id=>people.find(x=>x.id===id)).filter(Boolean).map(x=>x.name).join(" + ");
 return '<div class="card"><b>'+p.name+'</b><div class="small">Generation '+p.gen+'<br>Age '+p.age+'<br>'+(par?"Parents: "+par+"<br>":"")+(p.alive?"Living":"Died of old age")+'</div></div>';
}
function branch(p,seen){
 if(seen.has(p.id))return "";seen.add(p.id);let kids=p.children.map(id=>people.find(x=>x.id===id)).filter(Boolean);
 return '<div class="branch">'+card(p)+(kids.length?'<div class="kids">'+kids.map(k=>branch(k,seen)).join("")+'</div>':"")+'</div>';
}
function drawFamily(){
 let roots=people.filter(p=>p.parents.length===0);
 F.innerHTML='<div class="tree-controls"><button id="zin">Zoom In</button><button id="zout">Zoom Out</button><button id="zreset">Reset Zoom</button></div><h2>Family Tree</h2><p class="notice">Parents and children are connected automatically. The tree includes living people and people who have died of old age.</p><div id="tree" class="tree"><div class="roots">'+roots.map(r=>branch(r,new Set())).join("")+'</div></div>';
 let s=1,T=document.getElementById("tree");zin.onclick=()=>{s=Math.min(1.8,s+.1);T.style.transform="scale("+s+")"};zout.onclick=()=>{s=Math.max(.45,s-.1);T.style.transform="scale("+s+")"};zreset.onclick=()=>{s=1;T.style.transform="scale(1)"};
}
function drawPeople(){
 P.innerHTML="<h2>People</h2><p class=notice>Each person has a name, age, generation, parents, and status.</p>";
 people.forEach(p=>{let r=document.createElement("div");r.className="row";let par=p.parents.map(id=>people.find(x=>x.id===id)?.name).filter(Boolean).join(" + ");r.innerHTML="<div><b>"+p.name+"</b><div class=notice>Age "+p.age+" | Generation "+p.gen+(par?" | Parents: "+par:"")+"</div></div><span class=tag>"+(p.alive?"Living":"Died of old age")+"</span>";P.appendChild(r)})
}
function show(which){
 W.classList.toggle("hidden",which!=="world");F.classList.toggle("hidden",which!=="family");P.classList.toggle("hidden",which!=="people");
 worldTab.classList.toggle("active",which==="world");treeTab.classList.toggle("active",which==="family");peopleTab.classList.toggle("active",which==="people");
 if(which==="family")drawFamily();if(which==="people")drawPeople();
}
worldTab.onclick=()=>show("world");treeTab.onclick=()=>show("family");peopleTab.onclick=()=>show("people");
pause.onclick=()=>{paused=!paused;pause.textContent=paused?"Resume":"Pause"};restart.onclick=()=>location.reload();

people.push(addPerson(),addPerson());houses.push({x:43,y:38});addFood(10);drawWorld();stats();

setInterval(()=>{
 if(paused)return;
 clock++;foodClock++;
 if(clock>=5){year++;clock=0;age();if(!F.classList.contains("hidden"))drawFamily();if(!P.classList.contains("hidden"))drawPeople()}
 if(foodClock>=2){addFood(2);foodClock=0}
 birthClock++;if(birthClock>=6){reproduce();birthClock=0}
 move();if(Math.random()<.12)stored=Math.max(0,stored-1);stats();
},1000);
</script>
</body>
</html>
